# Tag -> prebuilt binaries and Scoop manifest. The tap syncs formulas itself.
#
# One ubuntu runner covers every target: the binary is pure Go (no cgo), so
# CGO_ENABLED=0 cross-compiles darwin/linux/windows x amd64/arm64 in a single
# job. No docker images, no macOS or Windows runners, no self-hosted hardware.
# cgo is the thing that would force a build matrix; we do not have it.
name: release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs full history to build the changelog.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate stable tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import release
          release.verify_tag(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_REF_NAME'])
          PY

      # AGENTS.md: "There is no CHANGELOG; the annotated tag message is the
      # release note." Honour that, falling back to GoReleaser's own commit
      # changelog when a tag carries no message body.
      - name: Use the annotated tag message as release notes
        run: |
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -n "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/release-notes.md"
            echo "RELEASE_NOTES_ARG=--release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_ENV"
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --clean --skip=publish,announce ${{ env.RELEASE_NOTES_ARG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo push (scoop bucket). The default GITHUB_TOKEN is scoped
          # to this repository only and cannot do it.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # daviddwlee84/homebrew-tap owns hourly/manual formula synchronization.
      # This release publishes assets and Scoop only; no cross-repo tap write.

      - name: Verify actual source and native binary payloads
        run: |
          python3 scripts/check-distribution.py --version "$GITHUB_REF_NAME" --source-archive "dist/translate_${GITHUB_REF_NAME#v}_source.tar.gz"
          python3 scripts/release.py check --project translate --tag "$GITHUB_REF_NAME" --smoke
      - name: Publish a complete verified draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py publish --project translate --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$RUNNER_TEMP/release-notes.md"
      - name: Publish generated Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: python3 scripts/publish-scoop.py --tag "$GITHUB_REF_NAME"
